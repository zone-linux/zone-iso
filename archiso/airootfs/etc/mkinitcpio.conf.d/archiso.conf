# Zone Linux live medium initramfs configuration.
# The base /etc/mkinitcpio.conf from the mkinitcpio package is intentionally
# left untouched; only the live-ISO-specific hooks are overridden here.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
