LABEL arch64_nbd
TEXT HELP
Boot the Zone Linux install medium using NBD.
It allows you to install Zone Linux or perform system maintenance.
ENDTEXT
MENU LABEL Zone Linux install medium (x86_64, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL arch64_nfs
TEXT HELP
