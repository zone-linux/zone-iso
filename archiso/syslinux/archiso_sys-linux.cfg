# Default
LABEL arch64
TEXT HELP
Boot the Zone Linux install medium on BIOS.
It allows you to install Zone Linux or perform system maintenance.
ENDTEXT
MENU LABEL Enter The Zone (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=5G %KERNEL_PARAMS%

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Zone Linux install medium with the speakup screen reader.
It allows you to install Zone Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Enter The Zone (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on cow_spacesize=5G %KERNEL_PARAMS%

# Copy to RAM boot option
LABEL arch64-ctr
TEXT HELP
Copy the live filesystem to RAM before booting.
Requires enough memory for the whole image.
ENDTEXT
MENU LABEL Enter The Zone (x86_64, BIOS, Copy to RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram cow_spacesize=1G %KERNEL_PARAMS%

# NVIDIA compatibility
LABEL arch64-nvidia
MENU LABEL Enter The Zone (x86_64, NVIDIA)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=5G nouveau.modeset=0 modprobe.blacklist=nouveau nvidia i915.modeset=1 radeon.modeset=1 %KERNEL_PARAMS%
